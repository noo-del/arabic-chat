openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Chat room and message history operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat/rooms:
    get:
      operationId: listChatRooms
      tags: [chat]
      summary: List chat rooms
      description: Returns the rooms visible in the current chat workspace
      responses:
        "200":
          description: Chat rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatRoom"
  /chat/rooms/{roomId}/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: List recent chat messages
      description: Returns recent messages for a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recent chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatRoom:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        unreadCount:
          type: integer
      required:
        - id
        - name
        - description
        - memberCount
        - unreadCount
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        author:
          type: string
        authorInitials:
          type: string
        authorRole:
          type: string
          enum: [admin, member]
        body:
          type: string
        sentAt:
          type: string
        isMine:
          type: boolean
        kind:
          type: string
          enum: [text, audio]
        duration:
          type: string
      required:
        - id
        - roomId
        - author
        - authorInitials
        - authorRole
        - body
        - sentAt
        - isMine
        - kind
        - duration

